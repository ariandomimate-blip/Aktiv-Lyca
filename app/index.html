<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webshop Sim</title><style>body{margin:0;background:#0b0b0d;color:#fff;font:16px system-ui}main{max-width:950px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.c{background:#17171a;border:1px solid #34343a;border-radius:18px;padding:20px}button{background:#fff;color:#000;border:0;border-radius:10px;padding:11px}</style></head><body><main><h1>Webshop Sim</h1><p>Standalone commerce simulation</p><div class="grid"><div class="c"><h2>Products</h2><p>Demo-Katalog</p><button onclick="alert('Katalog geöffnet')">Öffnen</button></div><div class="c"><h2>Cart</h2><p id="cart">0 Artikel</p><button onclick="add()">Artikel hinzufügen</button></div><div class="c"><h2>Checkout</h2><p>Demo-Checkout ohne echte Zahlung.</p></div></div></main><script>let n=0;function add(){n++;document.getElementById('cart').textContent=n+' Artikel'}</script></body></html>
