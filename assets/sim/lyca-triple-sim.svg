<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Lyca Mobile Triple-SIM</title>
<desc id="desc">Illustration of a Lyca Mobile 3-in-1 SIM card package</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#102c49"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d91"/><stop offset="1" stop-color="#061a5b"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset="1" stop-color="#d49b25"/></linearGradient>
</defs>
<rect width="900" height="600" rx="36" fill="url(#bg)"/>
<circle cx="720" cy="120" r="170" fill="#1677ff" opacity=".10"/><circle cx="770" cy="170" r="110" fill="#00d7a7" opacity=".08"/>
<g transform="translate(125 65) rotate(-3 325 235)">
  <rect x="0" y="0" width="650" height="470" rx="30" fill="url(#card)" stroke="#4d78d9" stroke-width="4"/>
  <text x="52" y="86" fill="white" font-family="Arial,sans-serif" font-size="58" font-weight="700">Lyca</text>
  <text x="52" y="132" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="600">Mobile</text>
  <text x="52" y="205" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Prepaid SIM card</text>
  <text x="52" y="252" fill="#21e6a5" font-family="Arial,sans-serif" font-size="32" font-weight="700">TRIPLE-SIM • 3-IN-1</text>
  <rect x="58" y="295" width="205" height="125" rx="18" fill="url(#chip)" stroke="#f7e4ad" stroke-width="5"/>
  <path d="M160 300v115M65 357h190M115 300v55h90v-55M115 415v-58h90v58" fill="none" stroke="#8a621d" stroke-width="9" opacity=".7"/>
  <text x="310" y="330" fill="white" font-family="Arial,sans-serif" font-size="27">Standard • Micro • Nano</text>
  <text x="310" y="372" fill="#d8e5ff" font-family="Arial,sans-serif" font-size="23">Bereits aktiviert</text>
  <text x="310" y="410" fill="#d8e5ff" font-family="Arial,sans-serif" font-size="23">Deutsche Mobilfunknummer</text>
  <text x="52" y="452" fill="#d8e5ff" font-family="Arial,sans-serif" font-size="18">Mindestaufladung 5 € • Telefonie • SMS • mobiles Internet</text>
</g>
</svg>
